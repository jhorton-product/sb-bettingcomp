<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---- tokens ---------------------------------------------------------- */
  :root{
    --ink:#0d1220; --panel:#141b2e; --panel2:#1b2440; --line:#26314f;
    --chalk:#eef1f7; --muted:#8791ad; --cyan:#37d0e8; --gold:#f5b642;
    --win:#5ad19a; --loss:#e2607a;
    --disp:'Barlow Condensed',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ink); color:var(--chalk); font-family:var(--body);
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .tnum{font-variant-numeric:tabular-nums}
  button{font-family:inherit; cursor:pointer}
  a{color:var(--cyan)}

  /* ---- top board ------------------------------------------------------- */
  header.board{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel),var(--ink));
    position:sticky; top:0; z-index:20;
  }
  .wrap{max-width:940px; margin:0 auto; padding:0 18px}
  .board-in{display:flex; align-items:baseline; justify-content:space-between; padding:16px 0 0}
  .mark{font-family:var(--disp); font-weight:700; font-size:30px; letter-spacing:.06em;
        text-transform:uppercase; line-height:1}
  .mark b{color:var(--cyan)}
  .whoami{font-size:13px; color:var(--muted)}
  .whoami b{color:var(--chalk); font-weight:600}
  nav.tabs{display:flex; gap:2px; margin-top:14px}
  nav.tabs button{
    background:none; border:none; color:var(--muted);
    font-family:var(--disp); font-weight:600; font-size:16px; letter-spacing:.05em;
    text-transform:uppercase; padding:10px 14px; border-bottom:2px solid transparent;
  }
  nav.tabs button[aria-selected="true"]{color:var(--chalk); border-bottom-color:var(--cyan)}

  main{max-width:940px; margin:0 auto; padding:22px 18px 80px}

  /* ---- generic bits ---------------------------------------------------- */
  .eyebrow{font-family:var(--disp); text-transform:uppercase; letter-spacing:.12em;
           font-size:13px; color:var(--muted); margin:0 0 10px}
  .segmented{display:inline-flex; background:var(--panel); border:1px solid var(--line);
             border-radius:9px; padding:3px; gap:2px}
  .segmented button{
    background:none; border:none; color:var(--muted); border-radius:6px;
    font-weight:600; font-size:13px; padding:7px 13px;
  }
  .segmented button[aria-pressed="true"]{background:var(--panel2); color:var(--chalk)}
  .filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px}
  .btn{background:var(--cyan); color:#04212a; border:none; border-radius:9px;
       font-weight:600; font-size:15px; padding:12px 18px}
  .btn.ghost{background:none; border:1px solid var(--line); color:var(--chalk)}
  .btn.gold{background:var(--gold); color:#3a2600}
  .btn[disabled]{opacity:.45; cursor:not-allowed}
  select{
    background:var(--panel); color:var(--chalk); border:1px solid var(--line);
    border-radius:9px; padding:11px 12px; font-family:inherit; font-size:15px; width:100%;
  }
  .empty{border:1px dashed var(--line); border-radius:12px; padding:26px; text-align:center;
         color:var(--muted)}
  .empty b{color:var(--chalk); display:block; font-family:var(--disp); font-size:19px;
           letter-spacing:.03em; margin-bottom:4px}

  /* ---- fixture card ---------------------------------------------------- */
  .day-label{font-family:var(--disp); text-transform:uppercase; letter-spacing:.08em;
             color:var(--muted); font-size:14px; margin:20px 0 8px}
  .game{background:var(--panel); border:1px solid var(--line); border-radius:12px;
        padding:0; margin-bottom:10px; overflow:hidden}
  .game.derby{border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset}
  .derby-flag{background:var(--cyan); color:#04212a; font-family:var(--disp);
              font-weight:700; letter-spacing:.08em; text-transform:uppercase;
              font-size:12px; padding:4px 12px}
  .side{display:flex; align-items:flex-start; gap:12px; padding:13px 15px}
  .side + .side{border-top:1px solid var(--line)}
  .side img{width:30px; height:30px; object-fit:contain; margin-top:2px; flex:0 0 30px}
  .side .tn{flex:1}
  .side .team{font-family:var(--disp); font-size:19px; font-weight:600; letter-spacing:.02em}
  .side .owners{font-size:12.5px; color:var(--muted); margin-top:2px}
  .side .owners.none{opacity:.5; font-style:italic}
  .side .sc{font-family:var(--disp); font-size:24px; font-weight:700}
  .side.won .team{color:var(--win)}
  .side.won .sc{color:var(--win)}
  .meta{padding:8px 15px; background:var(--panel2); font-size:12px; color:var(--muted);
        display:flex; justify-content:space-between}
  .tag-fav{color:var(--gold)}

  /* ---- leaderboard ----------------------------------------------------- */
  table.lb{width:100%; border-collapse:collapse}
  table.lb th{font-family:var(--disp); text-transform:uppercase; letter-spacing:.08em;
              font-size:12px; color:var(--muted); text-align:right; padding:8px 10px;
              border-bottom:1px solid var(--line)}
  table.lb th:nth-child(2){text-align:left}
  table.lb td{padding:11px 10px; border-bottom:1px solid var(--line); text-align:right}
  table.lb td:nth-child(2){text-align:left; font-weight:600}
  table.lb .rank{font-family:var(--disp); font-size:18px; color:var(--muted); width:34px}
  table.lb tr.me{background:var(--panel)}
  table.lb tr.me .rank{color:var(--cyan)}
  .pts{font-family:var(--disp); font-size:19px; font-weight:700}
  .up{color:var(--gold)}

  /* ---- my team --------------------------------------------------------- */
  .myteam{display:grid; grid-template-columns:1fr; gap:12px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px;
        padding:16px; display:flex; align-items:center; gap:14px}
  .card img{width:44px; height:44px; object-fit:contain}
  .card .lg{font-family:var(--disp); text-transform:uppercase; letter-spacing:.1em;
            font-size:12px; color:var(--muted)}
  .card .nm{font-family:var(--disp); font-size:22px; font-weight:600}

  /* ---- onboarding / gate ---------------------------------------------- */
  .center{min-height:70vh; display:flex; align-items:center; justify-content:center}
  .sheet{background:var(--panel); border:1px solid var(--line); border-radius:16px;
         padding:26px; width:100%; max-width:440px}
  .sheet h2{font-family:var(--disp); font-size:26px; font-weight:700; letter-spacing:.03em;
            margin:0 0 4px; text-transform:uppercase}
  .sheet p.sub{color:var(--muted); margin:0 0 20px; font-size:14px}
  .roll{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:18px 0}
  .roll .slot{background:var(--panel2); border:1px solid var(--line); border-radius:10px;
              padding:12px 8px; text-align:center}
  .roll .slot .lg{font-family:var(--disp); text-transform:uppercase; letter-spacing:.08em;
                  font-size:11px; color:var(--muted)}
  .roll .slot img{width:34px; height:34px; object-fit:contain; margin:6px 0}
  .roll .slot .nm{font-family:var(--disp); font-size:15px; font-weight:600; line-height:1.1}
  .roll .slot.empty-slot{color:var(--muted); display:flex; align-items:center;
                         justify-content:center; min-height:88px}
  .stack{display:flex; flex-direction:column; gap:10px}
  .divider{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px;
           text-transform:uppercase; letter-spacing:.1em; margin:6px 0}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line)}
  .warn{font-size:12.5px; color:var(--gold); margin-top:14px; text-align:center}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
         background:var(--panel2); border:1px solid var(--line); border-radius:10px;
         padding:12px 18px; font-size:14px; z-index:50}
  label.fld{display:block; font-size:12.5px; color:var(--muted); margin:0 0 6px}
</style>
</head>
<body>

<header class="board" id="topbar" hidden>
  <div class="wrap">
    <div class="board-in">
      <div class="mark">THE&nbsp;<b>LEAGUE</b></div>
      <div class="whoami">Signed in as <b id="meName">—</b></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="schedule" aria-selected="true">Schedule</button>
      <button data-tab="leaderboard">Leaderboard</button>
      <button data-tab="myteam">My team</button>
      <button data-tab="admin">Admin</button>
    </nav>
  </div>
</header>

<main id="app"><div class="empty">Loading…</div></main>
<div id="toast" class="toast" hidden></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// ============================ CONFIG ===================================
// Fill these two from Supabase -> Project Settings -> API.
const SUPABASE_URL      = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const ADMIN_PIN         = "4242";   // change me
const LEAGUE_LABEL = { "nba":"NBA", "nfl":"NFL", "eng.1":"EPL" };
// =======================================================================

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");
const $ = (s,r=document)=>r.querySelector(s);

const state = {
  me:null, players:[], teams:[], teamsById:{}, teamsByLeague:{},
  ownersByTeam:{}, myPicks:[], tab:"schedule",
  onb:{ league:"nba", picked:{} }, // onboarding scratch
};

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.hidden=false;
  clearTimeout(t._t); t._t=setTimeout(()=>t.hidden=true,2600);
}

// ---------------------------- boot -------------------------------------
async function boot(){
  if (SUPABASE_URL.startsWith("YOUR_")){
    app.innerHTML = `<div class="empty"><b>Add your Supabase keys</b>
      Open index.html and set SUPABASE_URL and SUPABASE_ANON_KEY near the top.</div>`;
    return;
  }
  const [{data:teams,error:te},{data:players,error:pe}] = await Promise.all([
    sb.from("lb_teams").select("*").order("name"),
    sb.from("lb_players").select("*").order("name"),
  ]);
  if (te||pe){ app.innerHTML=`<div class="empty"><b>Couldn’t reach the database</b>
    ${(te||pe).message}</div>`; return; }

  state.teams = teams;
  state.players = players;
  state.teamsById = Object.fromEntries(teams.map(t=>[t.id,t]));
  state.teamsByLeague = {};
  for (const t of teams){ (state.teamsByLeague[t.league] ||= []).push(t); }

  await loadOwners();

  const saved = localStorage.getItem("lb_player");
  state.me = state.players.find(p=>p.name===saved) || null;

  if (!state.me) return renderGate();
  await afterIdentity();
}

async function loadOwners(){
  const { data } = await sb.from("lb_picks").select("team_id, player:lb_players(name)");
  state.ownersByTeam = {};
  for (const row of (data||[])){
    (state.ownersByTeam[row.team_id] ||= []).push(row.player.name);
  }
}

async function afterIdentity(){
  $("#meName").textContent = state.me.name;
  const { data } = await sb.from("lb_picks")
    .select("*, team:lb_teams(*)").eq("player_id", state.me.id);
  state.myPicks = data||[];
  if (state.myPicks.length < 3){ document.getElementById("topbar").hidden=true; return renderOnboarding(); }
  document.getElementById("topbar").hidden=false;
  render();
}

// ---------------------------- identity gate ----------------------------
function renderGate(){
  document.getElementById("topbar").hidden=true;
  app.innerHTML = `
    <div class="center"><div class="sheet">
      <h2>Who are you?</h2>
      <p class="sub">Pick your name to get started. This is remembered on this device.</p>
      <label class="fld" for="whoSel">Your name</label>
      <select id="whoSel">
        <option value="" disabled selected>Select your name…</option>
        ${state.players.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}
      </select>
      <div style="height:16px"></div>
      <button class="btn" id="whoGo" disabled style="width:100%">That’s me</button>
    </div></div>`;
  $("#whoSel").onchange = e => $("#whoGo").disabled = !e.target.value;
  $("#whoGo").onclick = async () => {
    const id = Number($("#whoSel").value);
    state.me = state.players.find(p=>p.id===id);
    localStorage.setItem("lb_player", state.me.name);
    await afterIdentity();
  };
}

// ---------------------------- onboarding --------------------------------
function randomTeam(league){
  const list = state.teamsByLeague[league]||[];
  return list[Math.floor(Math.random()*list.length)];
}
function rollRemaining(chosenLeague){
  // fill the two leagues the player did NOT choose, at random
  state.onb.picked = {};
  for (const lg of Object.keys(LEAGUE_LABEL)){
    if (lg===chosenLeague) continue;
    state.onb.picked[lg] = randomTeam(lg);
  }
}
function rollAll(){
  state.onb.picked = {};
  for (const lg of Object.keys(LEAGUE_LABEL)) state.onb.picked[lg] = randomTeam(lg);
}

function renderOnboarding(){
  const chosen = state.onb.league;
  app.innerHTML = `
    <div class="center"><div class="sheet">
      <h2>Draft your teams</h2>
      <p class="sub">One team in each of the three leagues. Pick one yourself and we’ll
        randomise the rest — or randomise all three. Picks lock permanently.</p>

      <label class="fld">Pick one — choose the league</label>
      <div class="segmented" id="lgSeg">
        ${Object.entries(LEAGUE_LABEL).map(([k,v])=>
          `<button data-lg="${k}" aria-pressed="${k===chosen}">${v}</button>`).join("")}
      </div>
      <div style="height:10px"></div>
      <select id="teamSel">
        <option value="" disabled selected>Select a ${LEAGUE_LABEL[chosen]} team…</option>
        ${(state.teamsByLeague[chosen]||[]).map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}
      </select>
      <div style="height:12px"></div>
      <button class="btn ghost" id="pickOne" style="width:100%" disabled>Pick this + randomise the other two</button>

      <div class="divider">or</div>
      <button class="btn gold" id="rollAll" style="width:100%">🎲 Randomise all three</button>

      <div id="preview"></div>
    </div></div>`;

  $("#lgSeg").querySelectorAll("button").forEach(b=>{
    b.onclick = () => { state.onb.league=b.dataset.lg; state.onb.picked={}; renderOnboarding(); };
  });
  $("#teamSel").onchange = e => $("#pickOne").disabled = !e.target.value;
  $("#pickOne").onclick = () => {
    const t = state.teamsById[Number($("#teamSel").value)];
    rollRemaining(chosen);
    state.onb.picked[chosen] = t;      // chosen one flagged separately at save
    state.onb.chosenLeague = chosen;
    drawPreview();
  };
  $("#rollAll").onclick = () => { rollAll(); state.onb.chosenLeague=null; drawPreview(); };
}

function slot(lg){
  const t = state.onb.picked[lg];
  if (!t) return `<div class="slot empty-slot">—</div>`;
  return `<div class="slot"><div class="lg">${LEAGUE_LABEL[lg]}</div>
    ${t.logo_url?`<img src="${t.logo_url}" alt="">`:""}
    <div class="nm">${t.short_name||t.name}</div></div>`;
}
function drawPreview(){
  const done = Object.keys(state.onb.picked).length===3;
  $("#preview").innerHTML = `
    <div class="roll">${Object.keys(LEAGUE_LABEL).map(slot).join("")}</div>
    ${done?`
      <button class="btn" id="lockIn" style="width:100%">Lock in my teams</button>
      <p class="warn">⚠ Locked for the season — only an admin can reset your picks.</p>`:""}`;
  if (done) $("#lockIn").onclick = lockIn;
}

async function lockIn(){
  const rows = Object.entries(state.onb.picked).map(([lg,t])=>({
    player_id: state.me.id, league: lg, team_id: t.id,
    method: (lg===state.onb.chosenLeague) ? "chosen" : "random",
  }));
  const btn = $("#lockIn"); btn.disabled=true; btn.textContent="Locking…";
  const { error } = await sb.from("lb_picks").insert(rows);
  if (error){ toast(error.message); btn.disabled=false; btn.textContent="Lock in my teams"; return; }
  await loadOwners();
  await afterIdentity();
  toast("Teams locked. Good luck.");
}

// ---------------------------- main render -------------------------------
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>
    b.setAttribute("aria-selected", String(b.dataset.tab===state.tab)));
  if (state.tab==="schedule")     renderSchedule();
  else if (state.tab==="leaderboard") renderLeaderboard();
  else if (state.tab==="myteam")  renderMyTeam();
  else if (state.tab==="admin")   renderAdmin();
}
document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.tab = b.dataset.tab; render();
});

// ---- schedule ----
const sched = { range:"day", league:"all" };
function windowRange(){
  const now = new Date();
  const start = new Date(now); start.setHours(0,0,0,0);
  const end = new Date(start);
  if (sched.range==="day") end.setDate(end.getDate()+1);
  else end.setDate(end.getDate()+7);
  return { start, end };
}
async function renderSchedule(){
  app.innerHTML = `
    <p class="eyebrow">Fixtures &amp; results</p>
    <div class="filters">
      <div class="segmented" id="rangeSeg">
        <button data-r="day"  aria-pressed="${sched.range==='day'}">Today</button>
        <button data-r="week" aria-pressed="${sched.range==='week'}">Next 7 days</button>
      </div>
      <div class="segmented" id="lgSeg2">
        ${["all",...Object.keys(LEAGUE_LABEL)].map(k=>
          `<button data-l="${k}" aria-pressed="${sched.league===k}">${k==='all'?'All':LEAGUE_LABEL[k]}</button>`).join("")}
      </div>
    </div>
    <div id="games"><div class="empty">Loading fixtures…</div></div>`;
  $("#rangeSeg").onclick = e=>{const b=e.target.closest("button"); if(b){sched.range=b.dataset.r; renderSchedule();}};
  $("#lgSeg2").onclick  = e=>{const b=e.target.closest("button"); if(b){sched.league=b.dataset.l; renderSchedule();}};

  const { start, end } = windowRange();
  let q = sb.from("lb_games").select("*")
    .gte("starts_at", start.toISOString()).lt("starts_at", end.toISOString())
    .order("starts_at");
  if (sched.league!=="all") q = q.eq("league", sched.league);
  const { data:games, error } = await q;

  const box = $("#games");
  if (error){ box.innerHTML=`<div class="empty">${error.message}</div>`; return; }
  if (!games || !games.length){
    box.innerHTML = `<div class="empty"><b>No fixtures in this window</b>
      When the season’s on, games appear here automatically once the sync runs.</div>`;
    return;
  }
  // group by local date
  const byDay = {};
  for (const g of games){
    const d = new Date(g.starts_at).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
    (byDay[d] ||= []).push(g);
  }
  box.innerHTML = Object.entries(byDay).map(([day,gs])=>`
    <div class="day-label">${day}</div>
    ${gs.map(gameCard).join("")}`).join("");
}
function ownersLine(teamId){
  const names = state.ownersByTeam[teamId]||[];
  if (!names.length) return `<div class="owners none">no owner</div>`;
  return `<div class="owners">${names.join(" · ")}</div>`;
}
function sideRow(g, teamId, score){
  const t = state.teamsById[teamId];
  const won = g.status==="final" && g.winner_team_id===teamId;
  const nm = t ? (t.name) : "TBD";
  return `<div class="side ${won?'won':''}">
    ${t&&t.logo_url?`<img src="${t.logo_url}" alt="">`:`<div style="width:30px"></div>`}
    <div class="tn"><div class="team">${nm}</div>${ownersLine(teamId)}</div>
    ${g.status!=="scheduled"&&score!=null?`<div class="sc tnum">${score}</div>`:""}
  </div>`;
}
function gameCard(g){
  const derby = (state.ownersByTeam[g.home_team_id]?.length) && (state.ownersByTeam[g.away_team_id]?.length);
  const fav = g.favorite_team_id ? state.teamsById[g.favorite_team_id] : null;
  const time = new Date(g.starts_at).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  const status = g.status==="final" ? (g.is_draw?"Draw":"Final")
               : g.status==="in" ? "Live" : time;
  return `<div class="game ${derby?'derby':''}">
    ${derby?`<div class="derby-flag">Colleague derby</div>`:""}
    ${sideRow(g, g.away_team_id, g.away_score)}
    ${sideRow(g, g.home_team_id, g.home_score)}
    <div class="meta"><span>${LEAGUE_LABEL[g.league]||g.league} · ${status}</span>
      ${fav?`<span class="tag-fav">Favourite: ${fav.short_name||fav.name}</span>`:``}</div>
  </div>`;
}

// ---- leaderboard ----
async function renderLeaderboard(){
  app.innerHTML = `<p class="eyebrow">Standings</p><div id="lbbox"><div class="empty">Loading…</div></div>`;
  const { data, error } = await sb.from("lb_leaderboard").select("*");
  const box=$("#lbbox");
  if (error){ box.innerHTML=`<div class="empty">${error.message}</div>`; return; }
  const rows = (data||[]);
  const anyPoints = rows.some(r=>Number(r.points)>0);
  if (!anyPoints){
    box.innerHTML = `<div class="empty"><b>No points on the board yet</b>
      Everyone starts level. Points land automatically as owned teams win.</div>`;
    return;
  }
  box.innerHTML = `<table class="lb"><thead><tr>
      <th>#</th><th>Player</th><th>Wins</th><th>Upsets</th><th>Pts</th>
    </tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${r.player===state.me.name?'me':''}">
      <td class="rank tnum">${i+1}</td>
      <td>${r.player}</td>
      <td class="tnum">${r.wins}</td>
      <td class="tnum up">${r.upsets}</td>
      <td class="pts tnum">${Number(r.points)}</td>
    </tr>`).join("")}
    </tbody></table>`;
}

// ---- my team ----
function renderMyTeam(){
  const byLeague = Object.fromEntries(state.myPicks.map(p=>[p.league,p]));
  app.innerHTML = `<p class="eyebrow">My team</p>
    <div class="myteam">
    ${Object.keys(LEAGUE_LABEL).map(lg=>{
      const p = byLeague[lg]; const t = p?.team;
      return `<div class="card">
        ${t?.logo_url?`<img src="${t.logo_url}" alt="">`:`<div style="width:44px"></div>`}
        <div><div class="lg">${LEAGUE_LABEL[lg]}</div>
        <div class="nm">${t?t.name:"—"}</div></div></div>`;
    }).join("")}
    </div>
    <p class="warn" style="text-align:left">Locked for the season. Ask an admin if you need a reset.</p>`;
}

// ---- admin ----
let adminOK=false;
function renderAdmin(){
  if (!adminOK){
    app.innerHTML = `<p class="eyebrow">Admin</p>
      <div class="sheet" style="max-width:360px">
        <label class="fld" for="pin">Enter admin PIN</label>
        <input id="pin" type="password" inputmode="numeric"
          style="background:var(--panel2);color:var(--chalk);border:1px solid var(--line);border-radius:9px;padding:11px 12px;width:100%;font-size:15px"/>
        <div style="height:12px"></div>
        <button class="btn" id="pinGo" style="width:100%">Unlock</button>
      </div>`;
    $("#pinGo").onclick = ()=>{ if($("#pin").value===ADMIN_PIN){adminOK=true; renderAdmin();} else toast("Wrong PIN"); };
    return;
  }
  app.innerHTML = `<p class="eyebrow">Admin · reset picks</p>
    <div id="adminList"><div class="empty">Loading…</div></div>`;
  drawAdminList();
}
async function drawAdminList(){
  const { data } = await sb.from("lb_players")
    .select("id,name, picks:lb_picks(league, team:lb_teams(short_name,name))").order("name");
  $("#adminList").innerHTML = (data||[]).map(p=>{
    const picks = (p.picks||[]).map(x=>`${LEAGUE_LABEL[x.league]||x.league}: ${x.team?.short_name||x.team?.name||'—'}`).join(" · ");
    const has = (p.picks||[]).length>0;
    return `<div class="card" style="justify-content:space-between">
      <div><div class="nm" style="font-size:18px">${p.name}</div>
        <div class="owners" style="color:var(--muted);font-size:12.5px">${has?picks:"no picks yet"}</div></div>
      ${has?`<button class="btn ghost" data-reset="${p.id}">Reset picks</button>`:""}
    </div>`;
  }).join("");
  $("#adminList").querySelectorAll("[data-reset]").forEach(b=>{
    b.onclick = async ()=>{
      const id=Number(b.dataset.reset);
      if (!confirm("Reset this player’s picks? They’ll re-draft on next load.")) return;
      const { error } = await sb.from("lb_picks").delete().eq("player_id", id);
      if (error) return toast(error.message);
      await loadOwners();
      if (id===state.me.id){ state.myPicks=[]; }
      toast("Picks reset."); drawAdminList();
    };
  });
}

boot();
</script>
</body>
</html>
